# Alert rules drawn from the production gate in 04-EVALUATION.md §7.3 and the
# ADR-0015 curation thresholds. Every rule here corresponds to a number the
# blueprint already committed to — none were invented to fill a dashboard.
groups:
  - name: memory-platform
    rules:
      # §7.3: p95 memory.context < 350 ms for 7 days.
      - alert: ContextPackSlow
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(memory_context_duration_seconds_bucket[10m]))
          ) > 0.35
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "p95 context pack latency over the 350 ms production gate"
          description: "The gate is a 7-day sustained figure; this fires early so it is fixable before the window is spent."

      # ADR-0008: degrading to the lexical arm is correct behaviour, but a
      # sustained rate means the embedder is down, not blipping.
      - alert: PacksDegraded
        expr: rate(memory_pack_degraded_total[10m]) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Context packs are being built without the vector arm"
          description: "Retrieval is falling back to lexical. Check the embedding provider."

      # ADR-0015: alert at depth 100. The failure mode is nobody noticing.
      - alert: ReviewBacklogGrowing
        expr: memory_inbox_depth > 100
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Review inbox past the ADR-0015 alert threshold"
          description: "Extraction auto-disables at 200 sustained for 14 days."

      # The kill switch having fired is not itself a fault — but it must never
      # be discovered a month later.
      - alert: ExtractionDisabledByKillSwitch
        expr: memory_extraction_enabled == 0
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "LLM extraction is disabled for a project"
          description: "The ADR-0015 kill switch has fired, or extraction was turned off. It re-arms on the first day the backlog drops below threshold."

      # Both ends of the 30-85% band are failures: below, the extractor is
      # generating cleanup work; above, review has become a formality.
      - alert: ExtractionAcceptanceOutOfBand
        expr: memory_extraction_acceptance_rate < 0.30 or memory_extraction_acceptance_rate > 0.85
        for: 6h
        labels: { severity: info }
        annotations:
          summary: "Extraction acceptance rate outside the 30-85% band"

      # Suite 2 is zero-tolerance. Denials counting up is the system working;
      # a sudden burst is someone probing.
      - alert: ScopeDenialBurst
        expr: sum(rate(memory_scope_denied_total[5m])) > 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Unusual rate of scope or auth denials"

      - alert: WritesRefusedByBackpressure
        expr: rate(memory_backpressure_total[10m]) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Admission control is refusing writes"

      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Prometheus target {{ $labels.job }} is down"

      # Metrics endpoints can remain reachable while an HTTP readiness route,
      # reverse proxy, or upstream dependency is broken. Synthetic probes name
      # the affected service directly and therefore catch the failure that made
      # the Knowledge Console render a shell while every container was "Up".
      - alert: CriticalServiceEndpointDown
        expr: probe_success{criticality="critical"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Critical service {{ $labels.service }} failed its readiness probe"
          description: "Check the service, its proxy, and the dependency named by its readiness contract."

      - alert: ObservabilityEndpointDown
        expr: probe_success{criticality="observability"} == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Observability service {{ $labels.service }} failed its readiness probe"
          description: "The system may still serve traffic, but investigation evidence is at risk."

      # The reranker is intentionally optional. It is an alert only when the
      # API is configured to use it; otherwise a profile-gated container should
      # not create a permanent false incident.
      - alert: RerankerEndpointDown
        expr: |
          probe_success{service="reranker"} == 0
            and on () memory_rerank_enabled == 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Enabled reranker failed its health probe"
          description: "Retrieval will fall back to the base ranking path. Confirm the reranker model and container."

      # Exporter reachability only proves that the exporter process is alive.
      # These gauges perform the authenticated protocol check against the actual
      # database and pool, which is what the API and workers depend on.
      - alert: PostgresUnavailable
        expr: pg_up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Postgres exporter cannot query the memory database"

      - alert: PgBouncerUnavailable
        expr: pgbouncer_up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "PgBouncer exporter cannot query the pool"

      # A process can keep an HTTP listener open while its work loop has stalled.
      # The worker and scheduler move this timestamp only from their own event
      # loops, so a stale value catches that distinct failure mode.
      - alert: ServiceHeartbeatStale
        expr: time() - memory_service_heartbeat_timestamp_seconds > 90
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} event loop has not advanced for over 90 seconds"
          description: "The metrics endpoint may still answer; inspect blocked jobs, database waits, and process logs."

      - alert: AlertmanagerConfigReloadFailed
        expr: alertmanager_config_last_reload_successful == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Alertmanager failed to load its configuration"

      - alert: AlertNotificationDeliveryFailed
        expr: sum(increase(alertmanager_notifications_failed_total[15m])) > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Alertmanager could not deliver one or more notifications"
          description: "Check the configured webhook relay and its credentials before relying on paging."

  # ---------------------------------------------------------------------------
  # SLO burn rate.
  #
  # The rules above are thresholds with a `for:` clause, which answers "is it
  # bad right now". The §7.3 gates ask something different — "p95 < 350 ms for
  # 7 days", "Suite 2 at 100% for 30 consecutive days" — and a threshold alert
  # cannot express that. It fires on every transient blip and stays silent while
  # a slow, steady drip spends the entire window.
  #
  # `memory:gate_*_ok` are recording rules producing 1 when the gate is met, so
  # averaging one over a window gives the FRACTION of that window spent inside
  # the gate. That is exactly the quantity the acceptance criteria are written
  # about, and it is why the recording rules exist.
  #
  # Two windows per gate, both required to fire, which is the standard
  # multi-window burn-rate shape: the long window says the budget is genuinely
  # being consumed, the short one says it is still happening now. Either alone
  # produces the two classic failures — alerting on an incident that ended
  # yesterday, or paging for a thirty-second spike.
  - name: memory-platform-slo
    interval: 1m
    rules:
      - alert: ContextLatencyBudgetBurningFast
        expr: |
          avg_over_time(memory:gate_context_latency_ok[1h]) < 0.90
            and
          avg_over_time(memory:gate_context_latency_ok[5m]) < 0.90
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Context latency outside the 350 ms gate for >10% of the last hour"
          description: "At this rate the 7-day gate in 04-EVALUATION.md §7.3 cannot be met."

      - alert: ContextLatencyBudgetBurningSlow
        expr: |
          avg_over_time(memory:gate_context_latency_ok[24h]) < 0.98
            and
          avg_over_time(memory:gate_context_latency_ok[2h]) < 0.98
        for: 30m
        labels: { severity: info }
        annotations:
          summary: "Context latency has been out of gate for >2% of the last day"
          description: "Slow burn. Not an incident; it is how a 7-day gate is missed without anyone noticing."

      - alert: WriteLatencyBudgetBurning
        expr: |
          avg_over_time(memory:gate_write_latency_ok[1h]) < 0.95
            and
          avg_over_time(memory:gate_write_latency_ok[5m]) < 0.95
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "write -> retrievable p99 outside the 5 s gate"

      # §7.3 wants median inbox depth under 40 for 14 days. Depth is a gauge, so
      # this is a straight fraction-of-window rather than a rate.
      - alert: ReviewBacklogGateAtRisk
        expr: avg_over_time(memory:gate_inbox_depth_ok[24h]) < 0.80
        for: 2h
        labels: { severity: info }
        annotations:
          summary: "Review backlog above 40 for most of the last day"
          description: "The §7.3 production gate is a 14-day median; this is the early signal."

      # Capability C4 wants >= 95% correct trust attribution, and tier 0 in a
      # pack is not a degradation — it is the thing Suite 2 forbids outright.
      - alert: UntrustedContentReturned
        expr: memory:pack_untrusted_ratio > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "A tier-0 (untrusted) memory was returned in a context pack"
          description: "Suite 2 forbids this unconditionally. Treat as a containment issue, not a ranking bug."
