# Alertmanager — routing, grouping, inhibition and silences.
#
# Prometheus evaluates rules; it does not notify. Before this file the eight
# rules in alerts.yml transitioned to firing and stopped there: no receiver, no
# dedup, no silences, nobody told. `/api/v1/alertmanagers` reported zero active,
# which is a smoke detector wired to nothing.
#
# Local development has no notification destination. At startup,
# render-config.sh adds the generic webhook stanza below each receiver when
# ALERT_WEBHOOK_URL is supplied. Until then, alerts remain visible in the
# Alertmanager UI but do not pretend to page anyone.

global:
  resolve_timeout: 5m

route:
  # Group by alertname AND service so one degraded service does not suppress an
  # unrelated alert that happens to share a name.
  group_by: ["alertname", "job"]
  # Wait briefly before the first notification so a burst arrives as one message.
  group_wait: 30s
  group_interval: 5m
  # Long enough that a firing alert is not a pager every five minutes; short
  # enough that an unattended one resurfaces the same day.
  repeat_interval: 12h
  receiver: default

  routes:
    # Isolation and availability are the two things that must never wait for a
    # daily digest. Suite 2 is zero-tolerance and a DOWN target means the rest of
    # the dashboard is lying by omission.
    - matchers: ['severity="critical"']
      receiver: critical
      group_wait: 0s
      repeat_interval: 1h

    # Curation alerts are real but they are a weekly-cadence problem, not a 3am
    # one. ADR-0015's failure mode plays out over weeks; paging for it at night
    # trains people to ignore the channel.
    - matchers: ['alertname=~"ReviewBacklogGrowing|ExtractionAcceptanceOutOfBand|ExtractionDisabledByKillSwitch"']
      receiver: curation
      group_interval: 6h
      repeat_interval: 24h

inhibit_rules:
  # If a target is down, every latency and rate alert about it is a restatement
  # of the same fact. Without this, one dead API produces a wall of alerts and
  # the actual cause is somewhere in the middle of it.
  - source_matchers: ['alertname="TargetDown"']
    target_matchers: ['severity=~"warning|info"']
    equal: ["job"]

receivers:
  # Alerts still appear in Alertmanager's UI (:9093) and in Grafana when no
  # outbound receiver is configured.
  - name: default
    # ALERT_WEBHOOK_CONFIG

  - name: critical
    # ALERT_WEBHOOK_CONFIG

  - name: curation
    # ALERT_WEBHOOK_CONFIG
