receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
  # Loki 3.x ingests OTLP natively at /otlp/v1/logs, so no loki-specific
  # exporter or label mapping is needed — trace_id and span_id ride along as
  # structured metadata, which is what makes "jump from this trace to its logs"
  # work in Grafana.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
  debug:
    verbosity: basic

# Without this the collector serves no HTTP health endpoint at all — :13133
# refuses connections, so there is no way to distinguish "started" from
# "actually processing" other than reading logs.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  # Extensions only load if listed here; declaring the block above is not enough.
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      # Was `[debug]`, which prints a one-line summary and DISCARDS the payload.
      # The pipeline existed, ran, and reported healthy while throwing every log
      # away — the same shape of failure as the traces pipeline that had no SDK
      # behind it.
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
