; Full config file rather than env-generated, so this works identically across
; pgbouncer images. Mounted read-only at /etc/pgbouncer/pgbouncer.ini.

[databases]
memory = host=postgres port=5432 dbname=memory

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; Client auth: SCRAM. Only pgbouncer_auth's credential lives in userlist.txt;
; every other user is resolved via auth_query against Postgres.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = pgbouncer_auth
auth_dbname = memory
auth_query = SELECT username, password FROM pgbouncer.get_auth($1)

; Transaction pooling is what makes SET LOCAL scope hygiene work. Do not change
; this to session mode to "fix" a problem — fix the problem.
pool_mode = transaction
max_client_conn = 500
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

; Required for psycopg3 named prepared statements under transaction pooling.
max_prepared_statements = 200

; SQLAlchemy/psycopg send these at startup.
ignore_startup_parameters = extra_float_digits,options,search_path

; The admin console authenticates against auth_file ONLY — auth_query is not used
; for the `pgbouncer` pseudo-database. memory_owner is therefore unreachable here:
; it is not in userlist.txt, and pgbouncer.get_auth() excludes it on purpose
; (ops/initdb/01-roles.sql) so the owner verifier never leaves via the pooler.
; Naming it here produced `FATAL: no such user` on every console connection.
;
; pgbouncer_auth is the one credential in userlist.txt, so it is the only role
; that can reach the console. Read-only stats access is what the SHOW POOLS
; verification in docker-compose.yml needs; admin_users stays unset so that same
; credential cannot RELOAD, KILL or SHUTDOWN the pooler.
stats_users = pgbouncer_auth

logfile =
pidfile =
