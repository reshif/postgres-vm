# =============================================================================
# Universal Agent Memory Platform — local-first stack
#
#   cp .env.example .env && edit
#   ops/pgbouncer/gen-userlist.sh          # writes ops/pgbouncer/userlist.txt
#   docker compose up -d                    # migrations run automatically via `init`
#   docker compose up -d --scale worker=2   # if you want more workers
#
# No Redis (the queue lives in Postgres).
# Every image is pinned: an unpinned tag is a supply-chain decision you did not make.
#
# ONE external service: embeddings are served by Ollama running on the HOST
#   ollama pull bge-m3        # 1.2 GB, 1024-dim, L2-normalised
# This is a deliberate regression from the original "no external services"
# promise, made because in-compose TEI could not fit this hardware (see the note
# on the profile-gated `embeddings` service). It is the one thing here that
# compose cannot start, pin, or reproduce on a colleague's machine — a fresh
# clone needs Ollama installed and `OLLAMA_HOST=0.0.0.0:11434` before it works.
# If that portability matters more than local memory headroom, run
# `docker compose --profile tei up -d` on a box with ~16 GB for the VM and flip
# MEMORY_EMBEDDING_PROVIDER back to `local`.
#
# CONNECTION TOPOLOGY — read this before changing any DATABASE_URL
#
#   api      ──► pgbouncer:6432 (transaction pooling)  ──► postgres:5432
#   worker   ──► postgres:5432 DIRECT
#   scheduler──► postgres:5432 DIRECT
#   init     ──► postgres:5432 DIRECT
#
#   The API is the only service that should go through the pool. Everything else
#   connects directly, and each for a specific reason:
#
#   * Workers use Procrastinate, which relies on LISTEN/NOTIFY. Notifications are
#     session-scoped, and transaction-mode pooling hands the connection to another
#     client between transactions — the listener silently stops receiving work and
#     falls back to polling. It looks like "the queue is just slow." Do not route
#     workers through a transaction pool.
#   * Alembic takes session-level advisory locks and runs DDL. Both break or
#     misbehave under transaction pooling.
#   * The scheduler holds long-running consolidation transactions that would tie
#     up pool slots the API needs.
#
#   This is also why the app must use SET LOCAL / set_config(..., true) for scope
#   context: on the API path a connection is shared, and a bare SET leaks tenant
#   context to the next request. See mem.fn_set_scope in 01-SCHEMA.sql.
# =============================================================================

x-common-env: &common-env
  # Pooled path — API only.
  MEMORY_DATABASE_URL: postgresql+psycopg://memory_app:${DB_APP_PASSWORD:?set in .env}@pgbouncer:6432/memory
  # Direct path — workers, scheduler, migrations.
  MEMORY_DATABASE_URL_DIRECT: postgresql+psycopg://memory_app:${DB_APP_PASSWORD:?set in .env}@postgres:5432/memory
  # psycopg3 named prepared statements do not survive transaction pooling unless
  # PgBouncer is handling them. We enable max_prepared_statements on PgBouncer AND
  # cap the client side; if you see "prepared statement _pg3_N already exists",
  # this is the knob.
  MEMORY_DB_PREPARE_THRESHOLD: "0"
  # Embeddings run on host Ollama, not in this compose file. See ADR note at the
  # bottom: this is a deliberate, documented break from "no external services".
  # TEI (the `embeddings` service) is still here behind the `tei` profile — set
  # these three back to local / http://embeddings:80 to switch, nothing else.
  #
  # host.docker.internal resolves to the Windows/macOS host on Docker Desktop; the
  # extra_hosts entries below make it work on Linux too. Ollama must be listening
  # on 0.0.0.0 (OLLAMA_HOST=0.0.0.0:11434), not its default 127.0.0.1, or every
  # container gets connection-refused while `curl localhost:11434` works fine.
  MEMORY_EMBEDDING_PROVIDER: ollama
  MEMORY_EMBEDDING_URL: http://host.docker.internal:11434
  # Logical registry id (mem.embedding_models.id), NOT the Ollama tag. The '@N'
  # suffix versions the vector space so a re-embed is a new row, not a silent
  # overwrite; the provider adapter maps 'bge-m3@1' -> ollama model 'bge-m3'.
  MEMORY_EMBEDDING_MODEL: bge-m3@1
  MEMORY_EMBEDDING_STARTUP_GRACE_S: "180"
  # Cross-encoder rerank (ADR-0013). Off unless the eval proves it wins.
  MEMORY_RERANK_ENABLED: ${MEMORY_RERANK_ENABLED:-false}
  MEMORY_RERANK_URL: ${MEMORY_RERANK_URL:-http://reranker:80}
  # How many candidates the cross-encoder scores. This is the real latency
  # dial: cost is linear in candidates and measured at ~184 ms each on CPU,
  # so 40 costs ~7.4 s and 10 costs ~1.8 s. Most of the recall@1 gain comes
  # from reordering the HEAD of the list, so a smaller value keeps most of
  # the quality for a quarter of the time.
  MEMORY_RERANK_TOP_K: ${MEMORY_RERANK_TOP_K:-40}
  # Minimum raw cross-encoder score used to corroborate direct evidence.
  # It never stands alone as proof that the project contains an answer.
  MEMORY_EVIDENCE_RERANK_MIN_SCORE: ${MEMORY_EVIDENCE_RERANK_MIN_SCORE:-0.05}
  # Admission control (Phase 9). Off unless a deployment has tuned it: a limit
  # nobody sized for the traffic is a self-inflicted outage waiting for a spike.
  MEMORY_LIMITS_ENABLED: ${MEMORY_LIMITS_ENABLED:-false}
  MEMORY_RATE_LIMIT_READ_RPS: ${MEMORY_RATE_LIMIT_READ_RPS:-50}
  MEMORY_RATE_LIMIT_WRITE_RPS: ${MEMORY_RATE_LIMIT_WRITE_RPS:-10}
  MEMORY_MAX_QUEUE_DEPTH: ${MEMORY_MAX_QUEUE_DEPTH:-10000}
  MEMORY_MAX_MEMORIES_PER_TENANT: ${MEMORY_MAX_MEMORIES_PER_TENANT:-0}
  # OAuth (ADR-0004). Set the issuer to switch identity from the dev binding to
  # real tokens; the MCP gateway refuses the dev path once this is present.
  MEMORY_OAUTH_ISSUER: ${MEMORY_OAUTH_ISSUER:-}
  MEMORY_OAUTH_AUDIENCE: ${MEMORY_OAUTH_AUDIENCE:-}
  MEMORY_OAUTH_JWKS_URL: ${MEMORY_OAUTH_JWKS_URL:-}
  MEMORY_OAUTH_ALGORITHMS: ${MEMORY_OAUTH_ALGORITHMS:-RS256,ES256}
  MEMORY_OAUTH_ORG_CLAIM: ${MEMORY_OAUTH_ORG_CLAIM:-org}
  MEMORY_OAUTH_PROJECT_CLAIM: ${MEMORY_OAUTH_PROJECT_CLAIM:-project}

  # Browser login for the Knowledge Console: authorization-code + PKCE.
  #
  # The flow is fully implemented in console-app.tsx — verifier and state in
  # session storage, S256 challenge, code exchange, no client secret — and was
  # UNREACHABLE, because these settings were never passed to the API that serves
  # /v1/console/config. A login screen that cannot be configured is a login
  # screen that does not exist, and nothing failed loudly to say so.
  #
  # Served to the browser, so none of it is secret: a public SPA client has no
  # client secret and none would be accepted for this grant.
  MEMORY_CONSOLE_OIDC_CLIENT_ID: ${MEMORY_CONSOLE_OIDC_CLIENT_ID:-}
  MEMORY_CONSOLE_OIDC_SCOPES: ${MEMORY_CONSOLE_OIDC_SCOPES:-openid profile}
  MEMORY_CONSOLE_OIDC_REDIRECT_URI: ${MEMORY_CONSOLE_OIDC_REDIRECT_URI:-}
  MEMORY_CONSOLE_OIDC_RESOURCE: ${MEMORY_CONSOLE_OIDC_RESOURCE:-}
  MEMORY_CONSOLE_OIDC_AUTHORIZATION_ENDPOINT: ${MEMORY_CONSOLE_OIDC_AUTHORIZATION_ENDPOINT:-}
  MEMORY_CONSOLE_OIDC_TOKEN_ENDPOINT: ${MEMORY_CONSOLE_OIDC_TOKEN_ENDPOINT:-}
  # Row count at which a per-tenant partial HNSW index is built
  # automatically. 0 disables. Not a hard-coded 50k wait.
  MEMORY_PARTIAL_INDEX_THRESHOLD: ${MEMORY_PARTIAL_INDEX_THRESHOLD:-5000}
  # LLM extraction (Phase 5). `none` is the default and stays the default until a
  # curator exists: ADR-0015 makes the Inbox a precondition for the extractor.
  MEMORY_LLM_PROVIDER: ${MEMORY_LLM_PROVIDER:-none}   # none | ollama | openai | vllm
  MEMORY_LLM_MODEL: ${MEMORY_LLM_MODEL:-}
  MEMORY_LLM_URL: ${MEMORY_LLM_URL:-http://host.docker.internal:11434}
  MEMORY_LLM_TIMEOUT_S: ${MEMORY_LLM_TIMEOUT_S:-120}
  MEMORY_LLM_MAX_CANDIDATES: ${MEMORY_LLM_MAX_CANDIDATES:-5}
  # ADR-0015 kill switch. The plan's numbers are the defaults; they are knobs
  # because a 3-person team and a 300-person one do not share a triage capacity.
  MEMORY_CURATION_ALERT_DEPTH: ${MEMORY_CURATION_ALERT_DEPTH:-100}
  MEMORY_CURATION_DISABLE_DEPTH: ${MEMORY_CURATION_DISABLE_DEPTH:-200}
  MEMORY_CURATION_SUSTAINED_DAYS: ${MEMORY_CURATION_SUSTAINED_DAYS:-14}
  MEMORY_ACCEPT_RATE_MIN: ${MEMORY_ACCEPT_RATE_MIN:-0.30}
  MEMORY_ACCEPT_RATE_MAX: ${MEMORY_ACCEPT_RATE_MAX:-0.85}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_SERVICE_NAMESPACE: memory-platform
  MEMORY_LOG_LEVEL: ${MEMORY_LOG_LEVEL:-info}

services:

  # ---------------------------------------------------------------- database
  postgres:
    # pgvector >= 0.8.2 on PG18: iterative scans, parallel HNSW builds, halfvec,
    # and PG18 temporal constraints (WITHOUT OVERLAPS). Do not float this tag.
    # If you must run < PG18, see the ADR-0006 portability branch in 01-SCHEMA.sql.
    # Built from ops/postgres/Dockerfile: the pinned pgvector image plus pgTAP,
    # which Suite 2 needs to run its database-layer half. `image:` names the
    # build result so the tag stays readable in `docker compose ps`.
    build: { context: ./ops/postgres, dockerfile: Dockerfile }
    image: memory-platform/postgres:0.8.2-pg18-pgtap
    restart: unless-stopped
    # `-c` and its value must be SEPARATE argv entries. Writing `-c=work_mem=64MB`
    # makes postgres parse the parameter name as the empty string and die with
    # `FATAL: unrecognized configuration parameter ""` — during the entrypoint's
    # temporary-server phase, so the initdb.d role scripts never run either.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=1GB          # HNSW builds want this
      - -c
      - max_parallel_maintenance_workers=4
      - -c
      - effective_cache_size=6GB
      - -c
      - random_page_cost=1.1              # SSD
      - -c
      - log_min_duration_statement=200
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=200               # PgBouncer fronts the API; workers connect direct
    environment:
      POSTGRES_DB: memory
      POSTGRES_USER: memory_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?set in .env}
      # Consumed by ops/initdb/01-roles.sql
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set in .env}
      DB_RO_PASSWORD: ${DB_RO_PASSWORD:?set in .env}
      DB_PGBOUNCER_PASSWORD: ${DB_PGBOUNCER_PASSWORD:?set in .env}
    volumes:
      # PG18+ images changed the mount convention: mount /var/lib/postgresql, NOT
      # /var/lib/postgresql/data. The image now stores data in a major-version
      # subdirectory (/var/lib/postgresql/18/docker) so pg_upgrade --link works
      # without crossing a mount boundary. Mounting the old path makes the
      # container refuse to start with "there appears to be PostgreSQL data in
      # /var/lib/postgresql/data (unused mount/volume)" and restart-loop.
      # See docker-library/postgres#1259.
      - pgdata:/var/lib/postgresql
      # Suite 2's database half. Read-only: a test suite must not be able to
      # alter itself from inside the container it is testing.
      - "./ops/pgtap:/pgtap:ro"
      - ./ops/initdb:/docker-entrypoint-initdb.d:ro   # roles (NOBYPASSRLS) + pgbouncer auth fn
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory_owner -d memory"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["5432:5432"]                  # remove outside local dev

  # ------------------------------------------------------- connection pooler
  # Transaction mode, and actually on the API's connection path (it was previously
  # defined but bypassed — a pool nobody connects to is worse than no pool, because
  # it looks like coverage you do not have).
  #
  # Auth: auth_query against Postgres, with PgBouncer's own credential in
  # userlist.txt. Generate it with ops/pgbouncer/gen-userlist.sh before first start.
  pgbouncer:
    # Pinned. An unpinned `latest` here will eventually change pool_mode defaults
    # or config-file semantics under you, and the failure mode is a silent leak of
    # scope context rather than a crash.
    #
    # Note the `v` prefix and the `-pN` image-patch suffix: this repo publishes
    # `v1.25.2-p0`, NOT `1.25.2`. Tags without the prefix exist only up to 1.22.x,
    # so a plausible-looking pin like `1.24.0-p1` fails to resolve at pull time.
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: unless-stopped
    # Full config file rather than env-generated, so this behaves identically
    # regardless of which pgbouncer image you use.
    volumes:
      - ./ops/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./ops/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres: { condition: service_healthy }
    # No healthcheck: this image ships no psql/pg_isready, so the obvious check
    # fails permanently and drags every dependent service down. The API's /readyz
    # exercises the pooled path and reports it, which is the check that matters.
    ports: ["6432:6432"]                  # remove outside local dev

  # ------------------------------------------------------------- migrations
  # Runs once and exits, so `docker compose up` is genuinely one command.
  # Connects DIRECT: Alembic takes session advisory locks and runs DDL.
  #
  # Connects as memory_owner, NOT memory_app. The migration creates schema `mem`
  # and issues the GRANTs in 01-SCHEMA.sql to memory_app — neither of which the
  # grantee can do for itself. memory_app holds only CONNECT (01-roles.sql), and
  # since that file also revokes `public` from PUBLIC, memory_app's search_path
  # resolves to nothing: alembic can't even place its version table, and you get
  # `InvalidSchemaName: no schema has been selected to create in`.
  # This is the ONE place owner credentials appear; no app service gets them.
  init:
    build: { context: ., dockerfile: ops/Dockerfile, target: api }
    environment:
      <<: *common-env
      MEMORY_ROLE: migrate
      MEMORY_DATABASE_URL_MIGRATE: postgresql+psycopg://memory_owner:${DB_OWNER_PASSWORD:?set in .env}@postgres:5432/memory
    command: ["sh", "-c", "alembic -x url=$$MEMORY_DATABASE_URL_MIGRATE upgrade head"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # ------------------------------------------------------------- embeddings
  # Text Embeddings Inference. The CPU image handles a small team's write volume.
  # NOTE: no healthcheck. TEI's image ships no curl or wget, so the obvious
  # healthcheck fails permanently and takes every dependent service down with it.
  # The API tolerates a cold embedder by design (ADR-0008: retrieval degrades to
  # the lexical arm rather than failing closed), so `service_started` is correct.
  # Model download on first run takes minutes — watch it with:
  #   docker compose logs -f embeddings
  embeddings:
    # PROFILE-GATED — does not run by default. Embeddings are served by host
    # Ollama (see x-common-env). Re-enable with:
    #   docker compose --profile tei up -d
    # and point MEMORY_EMBEDDING_PROVIDER/_URL back at local / http://embeddings:80.
    #
    # Why it was moved off TEI on this hardware: TEI allocates the MAXIMUM batch
    # shape during warmup, and bge-m3 is XLM-RoBERTa-large, so at its 8192-token
    # max_input_length that measured ~9.7 GB resident — 83% of a 12 GB Docker VM,
    # never finishing warmup. TEI also refuses --max-batch-tokens below the model's
    # max_input_length unless --auto-truncate is set, so there is no small-and-
    # lossless setting available. llama.cpp sizes a KV cache to the actual context
    # instead of the theoretical maximum, which is why the same model is ~2 GB
    # under Ollama. This is a memory-architecture difference, not a tuning gap.
    profiles: ["tei"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    restart: unless-stopped
    # --max-batch-tokens is a MEMORY ceiling, not a throughput dial. TEI warms up
    # by allocating the maximum batch shape, and bge-m3 is XLM-RoBERTa-large, so
    # attention is O(n^2): at 16384 tokens that is 16384^2 x 16 heads x 4 bytes of
    # attention buffer before anything else. The container is SIGKILLed mid-warmup
    # by the host kernel, which loops forever and — because no mem_limit is set —
    # reports `OOMKilled=false`, so it reads as a mysterious silent restart rather
    # than an OOM. `docker events --filter event=die` showing 137 is the tell.
    #
    # This value cannot go BELOW the model's max_input_length (8192 for bge-m3)
    # unless --auto-truncate is set; TEI refuses to start otherwise. So 8192 is
    # the floor that preserves full-fidelity embeddings, and it requires a Docker
    # VM with room for it — see memory=12GB in %USERPROFILE%\.wslconfig. If you
    # move this stack to a smaller host, the choice is --auto-truncate (silently
    # truncates long inputs) or a smaller model, not a smaller number here.
    command: ["--model-id", "BAAI/bge-m3", "--pooling", "cls", "--max-batch-tokens", "8192"]
    volumes:
      - hfcache:/data
    ports: ["8090:80"]                    # local probing: curl localhost:8090/health
    # GPU variant: swap to :turing-1.8 / :86-1.8 and add a deploy.resources block.
    # Zero-GPU laptop alternative: nomic-embed-text via ollama.

  # Optional cross-encoder reranker (ADR-0013), profile-gated:
  #     docker compose --profile rerank up -d
  #     MEMORY_RERANK_ENABLED=true in .env
  #
  # bge-reranker-BASE, not -v2-m3. v2-m3 is the same 568M XLM-RoBERTa-large as the
  # embedder and would repeat the warmup OOM documented on the `embeddings`
  # service. base is 278M with a 512-token limit, so --max-batch-tokens can sit at
  # the model's own maximum without tripping TEI's refusal to start below
  # max_input_length.
  #
  # A cross-encoder scores (query, document) pairs jointly instead of comparing
  # two independently-produced vectors, which is why it can fix the failure the
  # eval actually shows: the right memory is in the candidate pool but ranked in
  # the bottom half, because a whole-document embedding averages away the one
  # paragraph that answers the question.
  #
  # It is OFF by default and stays off until the eval suite says it wins. That is
  # ADR-0013's rule, not a formality — it costs a second model and real latency on
  # the hot path.
  reranker:
    profiles: ["rerank"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    restart: unless-stopped
    # --max-batch-tokens stays at 512, and that is a MEASURED choice, not a
    # leftover. Raising it to 8192 with --auto-truncate was tried on the theory
    # that 40 candidates in one request would beat five round trips — a batch of
    # 8 had cost almost the same as a batch of 1 (1986 ms vs 2157 ms), which
    # looks like fixed per-request overhead.
    #
    # Refuted: 40 docs went 7374 ms -> 19422 ms, and even a batch of 8 got worse
    # (1986 -> 2947 ms). TEI logs `forcing max_batch_requests=8`, so it processes
    # 8 pairs at a time regardless of the ceiling; the only effect of the larger
    # value was padding each batch to a longer sequence. The cost is per-token
    # compute, not per-request overhead.
    #
    # The lever that works is MEMORY_RERANK_TOP_K: rerank FEWER candidates.
    command: ["--model-id", "BAAI/bge-reranker-base", "--max-batch-tokens", "8192"]
    # TEI allocates its maximum batch shape at warmup, so this is a memory dial.
    # This host has already lost a container to the OOM killer; a reranker that
    # dies falls back to RRF ordering, but one that takes the host with it does
    # not. The ceiling is explicit.
    mem_limit: 6g
    volumes:
      - hfcache:/data
    ports: ["8091:80"]

  # ---------------------------------------------------------------- core api
  # The ONLY service on the pooled connection path.
  api:
    build: { context: ., dockerfile: ops/Dockerfile, target: api }
    restart: unless-stopped
    environment:
      <<: *common-env
      MEMORY_ROLE: api
      # Read by GET /v1/console/config only, so the console can open on a working
      # scope instead of an empty form. The API itself still takes tenant/project
      # from the caller on every request — this grants nothing and binds nothing,
      # it just tells the console where to start. Remove when OAuth lands.
      MEMORY_DEV_TENANT_ID: ${MEMORY_DEV_TENANT_ID:-}
      MEMORY_DEV_PROJECT_ID: ${MEMORY_DEV_PROJECT_ID:-}
      MEMORY_DEV_PRINCIPAL_ID: ${MEMORY_DEV_PRINCIPAL_ID:-}
      # GitHub verifies the delivery signature before a body is parsed or any
      # project is resolved. Keep this disabled until the App is installed.
      MEMORY_GITHUB_ENABLED: ${MEMORY_GITHUB_ENABLED:-false}
      MEMORY_GITHUB_WEBHOOK_SECRET: ${MEMORY_GITHUB_WEBHOOK_SECRET:-}
      MEMORY_GITHUB_APP_ID: ${MEMORY_GITHUB_APP_ID:-}
      MEMORY_GITHUB_PRIVATE_KEY: ${MEMORY_GITHUB_PRIVATE_KEY:-}
      MEMORY_GITHUB_API_URL: ${MEMORY_GITHUB_API_URL:-https://api.github.com}
      MEMORY_GITHUB_PAT_ENCRYPTION_KEY: ${MEMORY_GITHUB_PAT_ENCRYPTION_KEY:-}
      MEMORY_GITHUB_EVIDENCE_SUFFIX: ${MEMORY_GITHUB_EVIDENCE_SUFFIX:--evidence}
      MEMORY_GITHUB_WEBHOOK_MAX_BYTES: ${MEMORY_GITHUB_WEBHOOK_MAX_BYTES:-1048576}
    # No `embeddings` dependency: it is profile-gated now, and compose refuses to
    # start a service that depends on an inactive-profile service. The embedder is
    # a host process outside compose's lifecycle either way — /readyz reports it as
    # degraded when cold, which is the ADR-0008 contract.
    depends_on:
      postgres:   { condition: service_healthy }
      pgbouncer:  { condition: service_started }
      init:       { condition: service_completed_successfully }
    # Reach host Ollama. Docker Desktop provides this name natively; host-gateway
    # makes the same compose file work on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # The checkout itself, READ-ONLY. Plane A ingestion reads `.memory/` from a
      # working tree and shells out to `git log` for provenance, so it needs the
      # real repo including .git. Read-only because ingestion must never be able
      # to write to the source of truth it is indexing — Plane A is authoritative
      # precisely because a human reviewed a diff into it.
      # The eval harness reads the same tree as its corpus.
      - .:/repo:ro
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  # --------------------------------------------------------------- mcp edge
  # Stateless per spec 2026-07-28: no session store, no sticky routing needed.
  # Scale horizontally; it holds no state worth keeping.
  mcp:
    build: { context: ., dockerfile: ops/Dockerfile, target: mcp }
    restart: unless-stopped
    environment:
      <<: *common-env
      MEMORY_API_URL: http://api:8080
      MCP_TRANSPORT: http
      MCP_PROTOCOL_VERSION: "2026-07-28"
      MCP_OAUTH_ISSUER: ${MCP_OAUTH_ISSUER:-}
      MCP_OAUTH_AUDIENCE: ${MCP_OAUTH_AUDIENCE:-https://memory.local/mcp}
      # DEV SCOPE BINDING. ADR-0004 resolves identity and project binding from
      # the token; until MCP_OAUTH_ISSUER is set there is no token, so the
      # gateway binds one project explicitly. It refuses to serve tools rather
      # than defaulting, so an unset value fails loudly instead of quietly
      # serving someone else's memory. Remove these when OAuth lands.
      MEMORY_DEV_TENANT_ID: ${MEMORY_DEV_TENANT_ID:-}
      MEMORY_DEV_PROJECT_ID: ${MEMORY_DEV_PROJECT_ID:-}
      MEMORY_DEV_PRINCIPAL_ID: ${MEMORY_DEV_PRINCIPAL_ID:-}
    depends_on:
      api: { condition: service_healthy }
    ports: ["8081:8081"]

  # ----------------------------------------------------------------- workers
  # DIRECT to Postgres — Procrastinate needs LISTEN/NOTIFY (see the topology note).
  # `deploy.replicas` is Swarm-only and silently ignored by `docker compose up`;
  # scale explicitly instead:  docker compose up -d --scale worker=2
  worker:
    build: { context: ., dockerfile: ops/Dockerfile, target: worker }
    restart: unless-stopped
    environment:
      <<: *common-env
      MEMORY_DATABASE_URL: postgresql+psycopg://memory_app:${DB_APP_PASSWORD:?set in .env}@postgres:5432/memory
      MEMORY_ROLE: worker
      MEMORY_WORKER_QUEUES: embedding,ingestion,extraction,github
      # The worker reads immutable Git objects through the App API; it never
      # needs a source checkout mounted from the host.
      MEMORY_GITHUB_APP_ID: ${MEMORY_GITHUB_APP_ID:-}
      MEMORY_GITHUB_PRIVATE_KEY: ${MEMORY_GITHUB_PRIVATE_KEY:-}
      MEMORY_GITHUB_API_URL: ${MEMORY_GITHUB_API_URL:-https://api.github.com}
      MEMORY_GITHUB_PAT_ENCRYPTION_KEY: ${MEMORY_GITHUB_PAT_ENCRYPTION_KEY:-}
      MEMORY_GITHUB_MAX_BLOB_BYTES: ${MEMORY_GITHUB_MAX_BLOB_BYTES:-262144}
      MEMORY_GITHUB_MAX_SYNC_FILES: ${MEMORY_GITHUB_MAX_SYNC_FILES:-250}
      # Internal-only Prometheus listener for event-loop heartbeats.
      MEMORY_METRICS_PORT: "9101"
    # The `embedding` queue calls out to host Ollama.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      init: { condition: service_completed_successfully }

  scheduler:
    build: { context: ., dockerfile: ops/Dockerfile, target: worker }
    restart: unless-stopped
    environment:
      <<: *common-env
      MEMORY_DATABASE_URL: postgresql+psycopg://memory_app:${DB_APP_PASSWORD:?set in .env}@postgres:5432/memory
      MEMORY_ROLE: scheduler        # consolidation, decay, conflicts, utility, reflection
      MEMORY_METRICS_PORT: "9100"
      # Plane A poll ingestion. Off unless a scope binding exists — a background
      # loop has no request to carry a token, so ADR-0004's "identity from the
      # token" needs a service identity here eventually.
      MEMORY_INGEST_ENABLED: ${MEMORY_INGEST_ENABLED:-false}
      MEMORY_INGEST_INTERVAL_S: ${MEMORY_INGEST_INTERVAL_S:-60}
      MEMORY_INGEST_REPO_PATH: /repo
      MEMORY_DEV_TENANT_ID: ${MEMORY_DEV_TENANT_ID:-}
      MEMORY_DEV_PROJECT_ID: ${MEMORY_DEV_PROJECT_ID:-}
      MEMORY_DEV_PRINCIPAL_ID: ${MEMORY_DEV_PRINCIPAL_ID:-}
    # Consolidation/reflection re-embed, so the scheduler needs the host route too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Read-only: ingestion must never write to the tree it indexes. Plane A is
      # authoritative precisely because a human reviewed a diff into it.
      - .:/repo:ro
    depends_on:
      init: { condition: service_completed_successfully }

  # ----------------------------------------------------------------- console
  console:
    # The operator console is a first-class runtime surface. Keeping it behind
    # a profile meant the standard stack could look healthy while its human
    # recovery interface was absent and therefore unmonitored.
    build: { context: ./console, dockerfile: Dockerfile }
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      AUTH_ISSUER: ${MCP_OAUTH_ISSUER:-}
    depends_on:
      api: { condition: service_healthy }
    ports: ["3000:3000"]

  # ----------------------------------------------------------- observability
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./ops/otel-config.yaml:/etc/otel/config.yaml:ro"]

  # Synthetic probes exercise actual readiness routes from inside the Compose
  # network. A service can export metrics while its proxy or upstream is broken.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes: ["./ops/blackbox.yml:/etc/blackbox/blackbox.yml:ro"]

  tempo:
    image: grafana/tempo:2.9.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - "./ops/tempo.yaml:/etc/tempo/tempo.yaml:ro"
      # tempo.yaml declares 48h retention and writes to /var/tempo. Without a
      # volume that path is container-local, so "48h retention" actually meant
      # "until the next restart" — and restarts are how you deploy.
      - "tempodata:/var/tempo"
    ports: ["3200:3200"]

  # ------------------------------------------------------------- exporters
  # Postgres is the single point of failure here: the queue, the vectors, the
  # RLS model and the audit log all live in it. Charting API latency while the
  # database is unmonitored is watching the symptom.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      # memory_ro: logs in, reads statistics, holds no DDL or write grants. An
      # exporter is a long-lived credential in a container whose only job is to
      # be scraped, so it gets the least privilege that still answers.
      DATA_SOURCE_NAME: "postgresql://memory_ro:${DB_RO_PASSWORD:?set in .env}@postgres:5432/memory?sslmode=disable"
    depends_on:
      postgres: { condition: service_healthy }

  # Pool saturation presents as unexplained API latency over an idle database —
  # a shape impossible to diagnose from either side alone.
  pgbouncer-exporter:
    image: prometheuscommunity/pgbouncer-exporter:v0.10.2
    restart: unless-stopped
    command:
      - --pgBouncer.connectionString=postgres://pgbouncer_auth:${DB_PGBOUNCER_PASSWORD:?set in .env}@pgbouncer:6432/pgbouncer?sslmode=disable
    depends_on:
      pgbouncer: { condition: service_started }

  # ------------------------------------------------------------------- logs
  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - "./ops/loki.yaml:/etc/loki/loki.yaml:ro"
      - "lokidata:/loki"

  # Ships every container's stdout into Loki. The application speaks OTLP with
  # trace ids attached, but Postgres, PgBouncer and nginx never will — and their
  # logs are exactly the ones wanted at 3am.
  promtail:
    image: grafana/promtail:3.3.2
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    volumes:
      - "./ops/promtail.yaml:/etc/promtail/promtail.yaml:ro"
      # A container that can read the docker socket can enumerate the host's
      # containers. That is the standard cost of centralised container logs; if
      # the trade is unacceptable, use the `loki` logging driver per service.
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "promtaildata:/tmp"
    depends_on:
      loki: { condition: service_started }

  # --------------------------------------------------------------- alerting
  # Prometheus EVALUATES rules; it does not notify. Without this service the
  # rules transition to firing and stop there — no grouping, no dedup, no
  # silences, nobody told.
  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    # A generic webhook is optional locally. When ALERT_WEBHOOK_URL is supplied,
    # the launch script inserts it into every routed receiver without committing
    # a notification credential to this repository.
    entrypoint: ["/bin/sh", "/etc/alertmanager/render-config.sh"]
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - "./ops/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"
      - "./ops/alertmanager/webhook.yml:/etc/alertmanager/webhook.yml:ro"
      - "./ops/alertmanager/render-config.sh:/etc/alertmanager/render-config.sh:ro"
      - "alertmanagerdata:/alertmanager"
    ports: ["9093:9093"]

  prometheus:
    image: prom/prometheus:v3.6.0
    restart: unless-stopped
    # Retention has to be stated. The default 15 days quietly makes the §7.3
    # gates unverifiable the moment one asks for a 30-day window.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --web.enable-lifecycle
      # Required by ops/backup/backup.sh to snapshot the TSDB consistently.
      # Copying the directory under a running Prometheus can capture a
      # half-written block.
      - --web.enable-admin-api
    volumes:
      - "./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "./ops/alerts.yml:/etc/prometheus/alerts.yml:ro"
      - "./ops/recording-rules.yml:/etc/prometheus/recording-rules.yml:ro"
      # Every metric ever collected lived in the container filesystem, so a
      # restart discarded the whole history and no gate written as "sustained
      # for N days" could ever have been evaluated.
      - "promdata:/prometheus"
    ports: ["9090:9090"]
    depends_on:
      alertmanager: { condition: service_started }
      blackbox-exporter: { condition: service_started }

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    environment:
      # LOCAL DEV ONLY. Anonymous viewer access is a security hole anywhere
      # shared — the dashboards expose project names, memory counts and query
      # text. The prod overlay must set these to "false" and wire real auth.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # WITHOUT THIS, EVERY DASHBOARD URL RENDERS A BLANK ERROR PAGE.
      # With root_url unset Grafana emits relative asset paths, so on
      # `/d/<uid>/x` the browser requests `/d/public/build/runtime.js`, gets a
      # 404, and shows "Grafana has failed to load its application files" while
      # every provisioning API still reports success. The value must be the
      # address a BROWSER uses, not the port the container binds.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
    volumes:
      - "./ops/grafana:/etc/grafana/provisioning:ro"
      # Dashboards come from provisioning, but alert silences, annotations and
      # the alerting state machine live in Grafana's own database. Losing them
      # means a silence set during an incident evaporates on the next deploy.
      - "grafanadata:/var/lib/grafana"
    ports: ["3001:3000"]
    depends_on:
      prometheus: { condition: service_started }
      loki: { condition: service_started }

  # ------------------------------------------------------------ local IdP
  # A REAL identity provider, for verifying the auth path against something that
  # serves OIDC discovery and a JWKS rather than a synthetic key.
  #
  #   docker compose --profile auth up -d keycloak
  #   sh ops/verify-oauth.sh
  #
  # Behind a profile because it is a verification dependency, not part of the
  # stack: the platform must run without it, and in production the issuer is
  # whatever the operator already uses.
  #
  # `start-dev` is correct HERE and nowhere else — it disables HTTPS enforcement
  # and uses an in-memory database, so the realm is rebuilt from the import on
  # every start and no state survives to drift from the file.
  keycloak:
    profiles: ["auth"]
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-port=8090"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # The issuer a token carries must be the URL the API will validate against,
      # and the API reaches Keycloak by its service name while a browser reaches
      # it on localhost. Fixing the hostname makes both see one issuer string —
      # otherwise every token fails issuer validation from one side or the other.
      KC_HOSTNAME: http://keycloak:8090
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - "./ops/keycloak:/opt/keycloak/data/import:ro"
    ports: ["8090:8090"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8090 && echo ok >&3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # ---------------------------------------------------------------- backups
  # Volumes survive a restart. They do not survive a deleted volume or a dead
  # disk — the last gap where failure is unrecoverable rather than disruptive.
  #
  #   docker compose run --rm backup                 one-off
  #   docker compose --profile backup up -d          scheduled loop
  backup:
    profiles: ["backup"]
    image: memory-platform/postgres:0.8.2-pg18-pgtap
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    # A loop rather than cron: a cron daemon in a container is a second
    # scheduler to supervise, and its failures are invisible.
    command:
      - |
        set -eu
        while true; do
          /backup.sh || echo "backup FAILED (next attempt in ${BACKUP_INTERVAL_S:-86400}s)"
          sleep ${BACKUP_INTERVAL_S:-86400}
        done
    environment:
      DB_HOST: postgres
      DB_NAME: memory
      DB_OWNER_USER: memory_owner
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set in .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_S: ${BACKUP_INTERVAL_S:-86400}
    volumes:
      - "./ops/backup/backup.sh:/backup.sh:ro"
      - "./ops/backup/restore.sh:/restore.sh:ro"
      - "backups:/backups"
      # Loki is read-only: this job only tars its chunks.
      - "lokidata:/loki:ro"
      # Prometheus is NOT, and that is a deliberate exception to an otherwise
      # good rule. Its snapshot API writes into /prometheus/snapshots and the
      # API contract expects the CALLER to delete the snapshot afterwards —
      # there is no "release snapshot" endpoint. Mounted read-only, the archive
      # succeeded and the cleanup failed, so every run left a snapshot behind
      # and the volume grew until it filled.
      #
      # The alternative — never snapshot, just copy the directory — risks
      # capturing a half-written block, which is a corrupt backup that looks
      # fine until the day it is needed.
      - "promdata:/prometheus"
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  hfcache:
  # Observability and backup state. Every one of these was container-local, so
  # the entire monitoring history was discarded on each `docker compose up`.
  promdata:
  grafanadata:
  tempodata:
  lokidata:
  promtaildata:
  alertmanagerdata:
  backups:

# -----------------------------------------------------------------------------
# Notes
#  * The MVP has no Redis and no separate vector or graph database. If you add
#    one, write the ADR explaining what measurement forced it.
#  * Workers have no inbound network exposure and should egress only to the
#    embedding service and explicitly allow-listed connector hosts.
#  * Host port bindings (5432, 6432, 8090) are local-dev conveniences. Strip them
#    in the prod overlay along with anonymous Grafana.
#  * Verifying the pool is actually carrying API traffic (not just running):
#      docker compose exec pgbouncer psql -h 127.0.0.1 -p 6432 -U pgbouncer_auth \
#        -d pgbouncer -c 'SHOW POOLS'
#    cl_active on the `memory` pool should be non-zero while the API serves traffic.
#    If it stays at zero, something is bypassing the pooler.
# -----------------------------------------------------------------------------
