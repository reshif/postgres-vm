server {
    # 3000, not nginx's default 80: docker-compose.yml maps `3000:3000` because
    # it was written for the Next.js dev server this replaces. Matching the port
    # keeps that contract, so the compose file needs no edit and anything
    # pointing at :3000 keeps working.
    listen 3000;
    # IPv6 too. Without it the container serves fine from outside but anything
    # inside that resolves `localhost` gets ::1 first and sees connection
    # refused — which is exactly how the healthcheck failed while the console
    # was working perfectly in a browser.
    listen [::]:3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin proxy to the API. Without this the console would need CORS on
    # every endpoint plus a credential the browser can read — two things to get
    # wrong in exchange for nothing.
    location /v1/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;   # /v1/context can wait on an embedder
    }

    location = /readyz {
        proxy_pass http://api:8080/readyz;
    }

    location = /csp-hashes.conf { return 404; }

    # Single-page app: unknown paths render the shell, which routes on the hash.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The console is an operator tool served from a trusted origin, and it loads
    # nothing from anywhere else. Saying so in a header means a stored-XSS bug in
    # a memory title cannot fetch a remote script to escalate with.
    include /usr/share/nginx/html/csp-hashes.conf;
    add_header Content-Security-Policy $memory_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}
