# =============================================================================
# docker-compose.prod.yml — overlay for anything that is not a laptop
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# What this overlay does, in one line each:
#   * removes every host port binding except the two that must be reachable
#   * turns off anonymous Grafana
#   * raises pool sizes and worker counts
#   * pins Postgres to a managed/replicated instance if you have one
#
# `ports: !reset []`, NOT `ports: []`.
#
# This overlay used the latter and it silently did nothing. Compose merges list
# fields, and an empty list is indistinguishable from "no opinion" — so every
# `ports: []` here was a comment with YAML syntax, and `docker compose config`
# on the merged files showed postgres still publishing 5432, Grafana still on
# 3001. The overlay's headline claim was false for every service it named, and
# nothing warned, because there is no error to raise: the file parsed, merged,
# and meant nothing.
#
# `!reset` (Compose spec 2.24+) is the tag that actually removes an inherited
# value. Verify rather than trust:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml config \
#     | grep -A2 'published'
# =============================================================================

services:

  postgres:
    ports: !reset []
    command:
      - postgres
      - -c=shared_buffers=8GB
      - -c=work_mem=64MB
      - -c=maintenance_work_mem=2GB
      - -c=max_parallel_maintenance_workers=8
      - -c=effective_cache_size=24GB
      - -c=random_page_cost=1.1
      - -c=log_min_duration_statement=200
      - -c=shared_preload_libraries=pg_stat_statements
      - -c=max_connections=300
      - -c=wal_level=replica
      - -c=archive_mode=on
      - -c=archive_command=/bin/true          # replace with your WAL archiver
    # If you move to managed Postgres, delete this service and point
    # MEMORY_DATABASE_URL_DIRECT and the pgbouncer DB_HOST at the endpoint.

  pgbouncer:
    ports: !reset []
    environment:
      DEFAULT_POOL_SIZE: "50"
      MIN_POOL_SIZE: "10"
      RESERVE_POOL_SIZE: "10"
      MAX_CLIENT_CONN: "2000"
      # Consider a second pooler in session mode if you ever need a session-scoped
      # workload behind a pool. Do NOT relax this one to session mode — the API
      # depends on transaction pooling for SET LOCAL scope hygiene.

  embeddings:
    ports: !reset []

  console:
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?set for prod}

  # Prometheus and Tempo are published in dev so `/targets` and a trace id are
  # one click away. Neither ships with any authentication whatsoever, and their
  # contents are not innocuous: Prometheus labels carry project slugs and
  # memory counts, and traces carry query text. Exposed on a shared network they
  # are a data leak that looks like a debugging convenience.
  #
  # Grafana is the only intended way in, and the block below puts OAuth on it.
  prometheus:
    ports: !reset []

  tempo:
    ports: !reset []

  # Alertmanager's UI has no authentication and its API can create silences —
  # anyone who can reach it can mute an alert. Grafana is the front door.
  alertmanager:
    ports: !reset []

  # ---------------------------------------------------------------- Grafana
  # This block was four lines: anonymous off, OAuth on, a client id and a
  # secret. It could not have worked and it was not safe if it had.
  #
  # It could not work because a generic OAuth provider needs its ENDPOINTS.
  # Grafana has no idea who the identity provider is without auth_url, token_url
  # and api_url, so `enabled: true` produced a login button that went nowhere.
  #
  # It was not safe because of the three defaults it left alone:
  #
  #   allow_sign_up defaults to TRUE. Every account the identity provider will
  #   authenticate — the whole company, or with a public provider, the whole
  #   internet — would have been granted a Grafana account automatically.
  #
  #   the login form stays enabled, so the built-in admin remains reachable
  #   alongside SSO. Wiring OAuth in front of a door that is still open is
  #   decoration.
  #
  #   the built-in admin password stays `admin` unless set. Anonymous access
  #   being off does not help when the default credential is public knowledge.
  #
  # NOT VERIFIED AGAINST A REAL IDENTITY PROVIDER. What has been checked is that
  # Grafana starts with this configuration, reports the provider as configured,
  # serves a login page offering only SSO, and refuses anonymous access — see
  # ops/verify-grafana-auth.sh. The redirect/token exchange itself needs your
  # IdP; run that script against staging before trusting this.
  grafana:
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Removes the username/password form entirely. Without it SSO is an
      # additional way in, not the only one.
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # The built-in admin survives OAuth and is the account that can change
      # every dashboard and datasource. Required, not defaulted.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set a real admin password}
      GF_USERS_ALLOW_SIGN_UP: "false"

      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: ${GRAFANA_OAUTH_NAME:-SSO}
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OAUTH_CLIENT_ID:?}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET:?}
      # The three that were missing. Without them the provider is unreachable.
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${GRAFANA_OAUTH_AUTH_URL:?authorize endpoint}
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${GRAFANA_OAUTH_TOKEN_URL:?token endpoint}
      GF_AUTH_GENERIC_OAUTH_API_URL: ${GRAFANA_OAUTH_API_URL:?userinfo endpoint}
      GF_AUTH_GENERIC_OAUTH_SCOPES: ${GRAFANA_OAUTH_SCOPES:-openid email profile}
      # PKCE: the authorization code is useless to an interceptor without the
      # verifier. Supported by every current IdP and free to enable.
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN: "true"

      # THE ACCESS DECISION. Authentication says who someone is; nothing above
      # says who is allowed IN. Grafana's own default for allow_sign_up is true,
      # which means every account the identity provider will authenticate — the
      # whole company, or with a public provider the whole internet — receives a
      # Grafana account on first login.
      #
      # So this defaults to FALSE, which fails closed: an unconfigured deployment
      # admits only accounts an administrator created, and admits nobody by
      # accident. Turn it on together with a domain or group restriction:
      #   GRAFANA_OAUTH_ALLOWED_DOMAINS   e.g. "example.com"
      #   GRAFANA_OAUTH_ALLOWED_GROUPS    e.g. "platform-oncall"
      #
      # Compose cannot express "sign-up on requires a restriction set", so
      # ops/verify-grafana-auth.sh checks that pairing. It is the one failure
      # here that is silent and permissive — everything works, people log in, and
      # the deployment is open to anyone the provider recognises.
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: ${GRAFANA_OAUTH_ALLOW_SIGN_UP:-false}
      GF_AUTH_GENERIC_OAUTH_ALLOWED_DOMAINS: ${GRAFANA_OAUTH_ALLOWED_DOMAINS:-}
      GF_AUTH_GENERIC_OAUTH_ALLOWED_GROUPS: ${GRAFANA_OAUTH_ALLOWED_GROUPS:-}
      # Role mapping. Defaults every authenticated user to Viewer and grants
      # Admin only on an explicit claim — a JMESPath over the userinfo response.
      # `strict` means a user whose claims match nothing is REFUSED rather than
      # silently handed the default role.
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: >-
        ${GRAFANA_OAUTH_ROLE_PATH:-contains(groups[*], 'grafana-admin') && 'Admin' || contains(groups[*], 'grafana-editor') && 'Editor' || 'Viewer'}
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: ${GRAFANA_OAUTH_ROLE_STRICT:-false}
      # Grafana Admin (server-wide, across organisations) is never granted by a
      # claim. It is the account that can add datasources pointing anywhere.
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "false"

      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:?}
      # Grafana is behind TLS in production; these are the cookie flags that
      # make the session cookie unusable over plaintext or from another site.
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: "lax"
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: "true"
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      # Dashboards carry project names, memory counts and query text. Snapshot
      # publishing uploads them to a third-party service by default.
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports: !reset []

  # Scale explicitly rather than relying on deploy.replicas (Swarm-only):
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --scale worker=4
