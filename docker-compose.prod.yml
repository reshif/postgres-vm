# =============================================================================
# docker-compose.prod.yml — overlay for anything that is not a laptop
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# What this overlay does, in one line each:
#   * removes every host port binding except the two that must be reachable
#   * turns off anonymous Grafana
#   * raises pool sizes and worker counts
#   * pins Postgres to a managed/replicated instance if you have one
# =============================================================================

services:

  postgres:
    ports: []
    command:
      - postgres
      - -c=shared_buffers=8GB
      - -c=work_mem=64MB
      - -c=maintenance_work_mem=2GB
      - -c=max_parallel_maintenance_workers=8
      - -c=effective_cache_size=24GB
      - -c=random_page_cost=1.1
      - -c=log_min_duration_statement=200
      - -c=shared_preload_libraries=pg_stat_statements
      - -c=max_connections=300
      - -c=wal_level=replica
      - -c=archive_mode=on
      - -c=archive_command=/bin/true          # replace with your WAL archiver
    # If you move to managed Postgres, delete this service and point
    # MEMORY_DATABASE_URL_DIRECT and the pgbouncer DB_HOST at the endpoint.

  pgbouncer:
    ports: []
    environment:
      DEFAULT_POOL_SIZE: "50"
      MIN_POOL_SIZE: "10"
      RESERVE_POOL_SIZE: "10"
      MAX_CLIENT_CONN: "2000"
      # Consider a second pooler in session mode if you ever need a session-scoped
      # workload behind a pool. Do NOT relax this one to session mode — the API
      # depends on transaction pooling for SET LOCAL scope hygiene.

  embeddings:
    ports: []

  console:
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?set for prod}

  grafana:
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OAUTH_CLIENT_ID:?}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET:?}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:?}
    ports: []

  # Scale explicitly rather than relying on deploy.replicas (Swarm-only):
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --scale worker=4
