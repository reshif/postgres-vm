# =============================================================================
# docker-compose.prod.yml — overlay for anything that is not a laptop
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# What this overlay does, in one line each:
#   * removes every host port binding except the two that must be reachable
#   * turns off anonymous Grafana
#   * raises pool sizes and worker counts
#   * pins Postgres to a managed/replicated instance if you have one
#
# `ports: !reset []`, NOT `ports: []`.
#
# This overlay used the latter and it silently did nothing. Compose merges list
# fields, and an empty list is indistinguishable from "no opinion" — so every
# `ports: []` here was a comment with YAML syntax, and `docker compose config`
# on the merged files showed postgres still publishing 5432, Grafana still on
# 3001. The overlay's headline claim was false for every service it named, and
# nothing warned, because there is no error to raise: the file parsed, merged,
# and meant nothing.
#
# `!reset` (Compose spec 2.24+) is the tag that actually removes an inherited
# value. Verify rather than trust:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml config \
#     | grep -A2 'published'
# =============================================================================

services:

  postgres:
    ports: !reset []
    command:
      - postgres
      - -c=shared_buffers=8GB
      - -c=work_mem=64MB
      - -c=maintenance_work_mem=2GB
      - -c=max_parallel_maintenance_workers=8
      - -c=effective_cache_size=24GB
      - -c=random_page_cost=1.1
      - -c=log_min_duration_statement=200
      - -c=shared_preload_libraries=pg_stat_statements
      - -c=max_connections=300
      - -c=wal_level=replica
      - -c=archive_mode=on
      - -c=archive_command=/bin/true          # replace with your WAL archiver
    # If you move to managed Postgres, delete this service and point
    # MEMORY_DATABASE_URL_DIRECT and the pgbouncer DB_HOST at the endpoint.

  pgbouncer:
    ports: !reset []
    environment:
      DEFAULT_POOL_SIZE: "50"
      MIN_POOL_SIZE: "10"
      RESERVE_POOL_SIZE: "10"
      MAX_CLIENT_CONN: "2000"
      # Consider a second pooler in session mode if you ever need a session-scoped
      # workload behind a pool. Do NOT relax this one to session mode — the API
      # depends on transaction pooling for SET LOCAL scope hygiene.

  embeddings:
    ports: !reset []

  console:
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?set for prod}

  # Prometheus and Tempo are published in dev so `/targets` and a trace id are
  # one click away. Neither ships with any authentication whatsoever, and their
  # contents are not innocuous: Prometheus labels carry project slugs and
  # memory counts, and traces carry query text. Exposed on a shared network they
  # are a data leak that looks like a debugging convenience.
  #
  # Grafana is the only intended way in, and the block below puts OAuth on it.
  prometheus:
    ports: !reset []

  tempo:
    ports: !reset []

  # Alertmanager's UI has no authentication and its API can create silences —
  # anyone who can reach it can mute an alert. Grafana is the front door.
  alertmanager:
    ports: !reset []

  grafana:
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OAUTH_CLIENT_ID:?}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET:?}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:?}
    ports: !reset []

  # Scale explicitly rather than relying on deploy.replicas (Swarm-only):
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --scale worker=4
