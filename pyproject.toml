[project]
name = "memory-platform"
version = "0.1.0"
description = "Universal agent memory platform — Phase 1 skeleton"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.3",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "procrastinate>=3.0",
  # ops/prometheus.yml scrapes api:8080/metrics. Without this the target is
  # permanently DOWN with a 404 and every API panel in Grafana renders empty.
  "prometheus-fastapi-instrumentator>=7.0",
  # OAuth token verification (ADR-0004). `crypto` brings the asymmetric
  # algorithms — without it PyJWT can only do HMAC, which would force the
  # shared-secret model this design specifically avoids.
  "pyjwt[crypto]>=2.9",
  # The console encrypts project-scoped GitHub PATs before storage.  This is a
  # direct dependency rather than relying on PyJWT's optional transitive extra.
  "cryptography>=43",
  # Tracing. OTEL_EXPORTER_OTLP_ENDPOINT has been set in docker-compose since
  # the first commit and the collector, Tempo and Grafana have all been running
  # — but nothing was ever installed to emit a span, so the traces pipeline
  # carried zero bytes and Tempo was permanently empty. An endpoint variable is
  # not instrumentation.
  #
  # The three instrumentations are chosen for what a slow context pack actually
  # decomposes into: FastAPI gives the request span, psycopg gives the
  # retrieval SQL, httpx gives the embedder and cross-encoder calls. Those are
  # the three places latency hides, and a trace missing any of them cannot
  # answer "why was that pack slow".
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp-proto-grpc>=1.28",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "opentelemetry-instrumentation-httpx>=0.49b0",
  "opentelemetry-instrumentation-psycopg>=0.49b0",
]

[project.scripts]
# Standard-library only, so it installs and runs anywhere.
memory = "memory_platform.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
